project:
  type: website
  output-dir: _site
  resources:
    - data
  render:
    - index.qmd
    - prepare.qmd
    - 00-r-warmup.qmd
    - 01-spatial-data.qmd
    - 02-units-of-analysis.qmd
    - 03-spatial-operations.qmd
    - 04-spatial-dependence.qmd
    - next-steps.qmd
    - slides/mini-lectures.qmd

execute:
  freeze: auto

website:
  title: "Spatial thinking & crime mapping in R"
  description: "A half-day, hands-on taster workshop: spatial data, units of analysis, spatial operations and spatial dependence, with code that runs in your browser."
  page-navigation: true
  reader-mode: true
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: prepare.qmd
        text: Before the session
      - href: slides/mini-lectures.qmd
        text: Slides
      - href: next-steps.qmd
        text: Where next?
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Welcome
      - prepare.qmd
      - section: "The workshop"
        contents:
          - 00-r-warmup.qmd
          - 01-spatial-data.qmd
          - 02-units-of-analysis.qmd
          - 03-spatial-operations.qmd
          - 04-spatial-dependence.qmd
      - next-steps.qmd
      - href: slides/mini-lectures.qmd
        text: Slides
  page-footer:
    left: "Workshop materials adapted from the Crime Mapping module (Solymosi & Medina, University of Manchester). Text licensed CC BY-SA 4.0."
    right: "Contains public sector information licensed under the Open Government Licence v3.0."

format:
  live-html:
    theme:
      light: [cosmo, theme.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    link-external-newwindow: true
